name: Bun voice server
on:
  push:
    paths:
      - 'server/**'
      - 'src/**'
      - 'biome.json'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'src/**'
      - 'biome.json'
      - '.github/workflows/server.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: bun install
        working-directory: server
      - run: bun run typecheck
        working-directory: server
      - run: bun run test
        if: ${{ !cancelled() }}
        working-directory: server
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - run: npx playwright test --config server/playwright.config.ts
        if: ${{ !cancelled() }}
      - run: npx playwright test --config server/namespace.playwright.config.ts
        if: ${{ !cancelled() }}
      - name: Check existing userscript and committed distribution
        if: ${{ !cancelled() }}
        run: |
          npm run check
          git diff --exit-code -- dist/ desktop/dist/
      - name: Validate stock Caddy authentication and token file
        if: ${{ !cancelled() }}
        run: |
          curl --fail --location --silent --show-error 'https://caddyserver.com/api/download?os=linux&arch=amd64' -o /tmp/caddy
          chmod +x /tmp/caddy
          bun run server/caddy-smoke.ts /tmp/caddy
          bun run server/caddy-mount-smoke.ts /tmp/caddy
